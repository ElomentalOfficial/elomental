name: Deploy web to beta.elomental.online

# The beta site: every push to the beta branch is built against the BETA Supabase project and
# published to the gh-pages branch of ElomentalOfficial/elomental-beta, whose GitHub Pages serves
# beta.elomental.online. Live (main, pages.yml) is untouched. The build refuses to run without
# the beta project's address, so a beta build can never point at live players' data.
#
# Needs, in this repository's Settings > Secrets and variables > Actions:
# - optional variables BETA_SUPABASE_URL and BETA_SUPABASE_KEY (else the beta project's own, below)
# - secret BETA_DEPLOY_TOKEN (a fine-grained token: ElomentalOfficial/elomental-beta, Contents read and write)
# - optional variable BETA_TURNSTILE_SITE_KEY (else the live widget's key, which must list
#   beta.elomental.online among its hostnames)

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_ENV: beta
      # the beta project (public by design, like the live one in client.ts); variables override
      VITE_SUPABASE_URL: ${{ vars.BETA_SUPABASE_URL || 'https://skuxlbukdynqsetnyqzw.supabase.co' }}
      VITE_SUPABASE_KEY: ${{ vars.BETA_SUPABASE_KEY || 'sb_publishable_3lMpeOjhQcGIxaMW4goewQ_f1ks36Bl' }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.BETA_TURNSTILE_SITE_KEY || '0x4AAAAAAFbT-did4rZdUb9s' }}
    steps:
      - name: Refuse to build without the beta project
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_KEY" ]; then
            echo "::error::Set the BETA_SUPABASE_URL and BETA_SUPABASE_KEY variables first."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            *xekeiwaxxsmvalezgtyj*) echo "::error::BETA_SUPABASE_URL is the live project."; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish to ElomentalOfficial/elomental-beta
        env:
          TOKEN: ${{ secrets.BETA_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The BETA_DEPLOY_TOKEN secret is missing or empty in this repository (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi
          cd packages/web/dist
          echo beta.elomental.online > CNAME
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Beta build ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${TOKEN}@github.com/ElomentalOfficial/elomental-beta.git" gh-pages \
            || { echo "::error::The push to ElomentalOfficial/elomental-beta was refused: the token needs Contents read and write on that repository, approved by the organization if it asks (docs/BETA.md)."; exit 1; }
