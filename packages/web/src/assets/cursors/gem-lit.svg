<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The gem cursor over something you can click (gem.svg, lit): the same blade and hotspot
       (2,2), a brighter emerald and frame, and a spark in the gem. -->
  <defs>
    <linearGradient id="gem" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#b2ffdb"/>
      <stop offset="0.55" stop-color="#2fd184"/>
      <stop offset="1" stop-color="#0f7041"/>
    </linearGradient>
    <path id="scroll" d="M-0.5 1.6 C-2 2.1 -4 1.6 -4.6 3.3 C-5.1 4.8 -3.6 5.9 -2.6 5 C-1.9 4.3 -2.5 3.5 -3.2 3.9"/>
  </defs>
  <g fill="none" stroke="#17130b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 2 L9.6 21.3 L18.4 14.7 Z" fill="#17130b" stroke-width="1.8"/>
  </g>
  <path d="M2 2 L9.6 21.3 L9.76 17.85 L5.2 6.27 Z" fill="#fbe6a8"/>
  <path d="M2 2 L18.4 14.7 L15.04 13.89 L5.2 6.27 Z" fill="#e0b04f"/>
  <path d="M9.6 21.3 L18.4 14.7 L15.04 13.89 L9.76 17.85 Z" fill="#9c6c24"/>
  <path d="M2.6 3.3 L9.2 20" stroke="#fffbe8" stroke-width="0.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M5.2 6.27 L9.76 17.85 L15.04 13.89 Z" fill="url(#gem)" stroke="#4d3410" stroke-width="0.45" stroke-linejoin="round"/>
  <path d="M5.2 6.27 L10 12.7 L9.76 17.85 Z" fill="#dcfff0" opacity="0.45"/>
  <path d="M9.76 17.85 L10 12.7 L15.04 13.89 Z" fill="#05331d" opacity="0.28"/>
  <path d="M8.6 9 L9.1 10.9 L11 11.4 L9.1 11.9 L8.6 13.8 L8.1 11.9 L6.2 11.4 L8.1 10.9 Z" fill="#ffffff" opacity="0.95"/>
  <!-- the scrollwork, drawn in the blade's own frame (its base's middle at 14,18, turned to its
       axis) so the two sides mirror exactly: a knob, a scroll curling out and down each side,
       and a stem ending in a drop -->
  <g transform="translate(14 18) rotate(-36.87)" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke="#17130b" stroke-width="2.4">
      <use href="#scroll"/>
      <use href="#scroll" transform="scale(-1 1)"/>
      <path d="M0 2.2 L0 5.4"/>
    </g>
    <path d="M0 5.3 L0.9 6.5 L0 7.7 L-0.9 6.5 Z" fill="#17130b" stroke="#17130b" stroke-width="1.6"/>
    <g fill="none" stroke="#ecbf5e" stroke-width="1.05">
      <use href="#scroll"/>
      <use href="#scroll" transform="scale(-1 1)"/>
      <path d="M0 2.2 L0 5.4"/>
    </g>
    <path d="M0 5.3 L0.9 6.5 L0 7.7 L-0.9 6.5 Z" fill="#e0b04f"/>
    <path d="M0 -0.2 L1.4 1.2 L0 2.6 L-1.4 1.2 Z" fill="#f4cd72" stroke="#17130b" stroke-width="0.7"/>
  </g>
</svg>
