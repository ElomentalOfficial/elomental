<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The Deco arrow over something you can click (arrow.svg, lit): the same arrowhead and hotspot
       (2,2), brighter gold, and the upper diamond at its foot filled in. -->
  <defs>
    <path id="head" d="M0 0 L7.2 18.4 L0 22.8 L-7.2 18.4 Z"/>
    <path id="upper" d="M0 18.7 L1.9 20.6 L0 22.5 L-1.9 20.6 Z"/>
    <path id="lower" d="M0 20.5 L2.3 22.8 L0 25.1 L-2.3 22.8 Z"/>
    <clipPath id="inside"><use href="#head"/></clipPath>
  </defs>
  <g transform="translate(2 2) rotate(-25) scale(1.12)" stroke-linejoin="round">
    <g fill="none" stroke="#17130b" stroke-width="1.9">
      <use href="#head"/>
      <use href="#lower"/>
    </g>
    <g fill="#272716">
      <use href="#head"/>
      <use href="#lower"/>
    </g>
    <g clip-path="url(#inside)" fill="none" stroke="#f4dfa9" stroke-linecap="butt">
      <path d="M-9 20.1 L0 8.4 L9 20.1 M-9 21.7 L0 10 L9 21.7" stroke-width="0.7" stroke-linejoin="miter"/>
      <path d="M-2.6 13.4 V19.5 M-1.4 11.8 V19.5 M1.4 11.8 V19.5 M2.6 13.4 V19.5" stroke-width="0.6"/>
    </g>
    <use href="#head" fill="none" stroke="#fde29a" stroke-width="0.85"/>
    <use href="#upper" fill="#fde29a" stroke="#fde29a" stroke-width="0.75"/>
    <use href="#lower" fill="none" stroke="#fde29a" stroke-width="0.75"/>
  </g>
</svg>
