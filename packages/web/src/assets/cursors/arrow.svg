<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The Deco arrow cursor (owner's reference sheet, the fourth arrowhead): a dark arrowhead
       outlined in gold, a double chevron under its tip, four bars below it, and two stacked
       diamonds at its foot. Drawn upright with its tip at 0,0 and turned a little, like a pointer, so the
       tip sits at 2,2 (the hotspot). A dark rim keeps it readable on the light theme. Colours are
       the art's own, like the avatars'. arrow-lit.svg is the same over something to click;
       scripts/cursors.ts renders the PNGs. -->
  <defs>
    <path id="head" d="M0 0 L7.2 18.4 L0 22.8 L-7.2 18.4 Z"/>
    <path id="upper" d="M0 18.7 L1.9 20.6 L0 22.5 L-1.9 20.6 Z"/>
    <path id="lower" d="M0 20.5 L2.3 22.8 L0 25.1 L-2.3 22.8 Z"/>
    <clipPath id="inside"><use href="#head"/></clipPath>
  </defs>
  <g transform="translate(2 2) rotate(-25) scale(1.12)" stroke-linejoin="round">
    <!-- the dark rim and body -->
    <g fill="#17130b" stroke="#17130b" stroke-width="1.9">
      <use href="#head"/>
      <use href="#lower"/>
    </g>
    <!-- inside the head: the double chevron and the four bars, cut at the outline -->
    <g clip-path="url(#inside)" fill="none" stroke="#d9c08a" stroke-linecap="butt">
      <path d="M-9 20.1 L0 8.4 L9 20.1 M-9 21.7 L0 10 L9 21.7" stroke-width="0.7" stroke-linejoin="miter"/>
      <path d="M-2.6 13.4 V19.5 M-1.4 11.8 V19.5 M1.4 11.8 V19.5 M2.6 13.4 V19.5" stroke-width="0.6"/>
    </g>
    <!-- the gold outline, then the two diamonds at the foot -->
    <use href="#head" fill="none" stroke="#f0c96a" stroke-width="0.85"/>
    <use href="#upper" fill="#17130b" stroke="#f0c96a" stroke-width="0.75"/>
    <use href="#lower" fill="none" stroke="#f0c96a" stroke-width="0.75"/>
  </g>
</svg>
