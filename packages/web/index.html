<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#262721" />
    <script>
      // Apply the saved theme before first paint so there is no flash. The welcome
      // ribbon is always dark, so the page (and iOS status bar) start dark too.
      document.documentElement.classList.add('welcome-active');
      try {
        document.documentElement.dataset.theme =
          JSON.parse(localStorage.getItem('elomental:theme')) === 'light' ? 'light' : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Opaque status bar on purpose. With black-translucent, iOS home-screen apps draw
      under the status bar, add an unremovable fade over the top of the page (iOS 26)
      and size the page short by the status-bar height, leaving a strip at the bottom.
      With default, the page gets its own full-height area below the status bar.
      iOS only reads this when the app is added to the home screen.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Elomental" />
    <title>Elomental</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- iOS only reads a PNG touch icon; without it Safari falls back to the domain root's icon. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
