<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#262721" />
    <script>
      // Apply the saved theme before first paint so there is no flash. iOS colours
      // the opaque status bar from theme-color as the app launches, so it must be
      // the theme's colour from the very first moment (the welcome ribbon included).
      document.documentElement.classList.add('welcome-active');
      // Home-screen app: the page draws under the status bar (see the meta tag below).
      if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) {
        document.documentElement.classList.add('standalone');
      }
      var theme = 'dark';
      try {
        if (JSON.parse(localStorage.getItem('elomental:theme')) === 'light') theme = 'light';
      } catch {}
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#FFFFE5' : '#262721';
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Draw under the status bar so it shows the app's own colour in both themes.
      With "default", iOS paints an opaque bar from the *system* appearance, so a
      phone in dark mode got a black bar over the light theme. The translucent
      mode's side effects are handled in styles.css and viewport.ts.
      iOS only reads this when the app is added to the home screen.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Elomental" />
    <title>Elomental</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- iOS only reads a PNG touch icon; without it Safari falls back to the domain root's icon. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400&family=Montserrat:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- iOS 26 colours the status bar from a fixed, full-width, opaque strip at the top edge. -->
    <div id="status-tint" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
